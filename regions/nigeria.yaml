promptTemplates:
  - id: "disease-detection-en"
    taskType: "disease-detection"
    language: "en"
    systemPrompt: |
      You are an expert plant pathologist specializing in crop diseases in Nigeria.
      Analyze the crop image and identify the disease with high accuracy.
      Respond ONLY with valid JSON in this exact format:
      {
        "disease_id": "string (from provided list)",
        "confidence": 0.0-1.0,
        "symptoms": ["symptom1", "symptom2"],
        "reasoning": "brief explanation of visual evidence"
      }
    userPromptTemplate: "Identify the disease in this {crop} image from {region}. Possible diseases: {disease_list}. Consider symptoms like leaf spots, discoloration, wilting, lesions, or pest damage."
    outputFormat: "json"
  - id: "disease-detection-ha"
    taskType: "disease-detection"
    language: "ha"
    systemPrompt: |
      Kai tsaye ne matsayin maganin cututtukan gona a Nijeriya.
      Bincika hoton gona kuma neman cutar da yaɗa da tsaftaccu.
      Amsa KWALBA da JSON mai daidai a cikin haka:
      {
        "disease_id": "string (daga jerin da aka ba)",
        "confidence": 0.0-1.0,
        "symptoms": ["alama1", "alama2"],
        "reasoning": "bayani na alama da aka ga"
      }
    userPromptTemplate: "Nemo cutar a cikin wannan hoto na {crop} daga {region}. Cututtuka da ake kwata: {disease_list}. Tuna da alamomi kamar tsutsunen kaye, sauƙaƙe na launɒ, barre, vidondi, ko yaɗuwar ƙirƙirar cutarwa."
    outputFormat: "json"
  - id: "disease-detection-yo"
    taskType: "disease-detection"
    language: "yo"
    systemPrompt: |
      Ṣe onígbàgbọ́ àwọn àrúnkúnwá ẹ̀kọ́ ní Orílẹ̀-èdè Nàìjíríà.
      Túbọ̀ àwọn àwòrán ẹ̀kọ́ kí ó sì fi ẹ̀kọ́ ara wọn dá sílẹ̀ ní ìgbàgbọ́ gígà.
      Dá sí ìmọ̀ yí ní JSON tó dára ní bẹ́ẹ̀ ní:
      {
        "disease_id": "string (láti àkọ́ṣọ̀rọ̀ tí a fí hàn)",
        "confidence": 0.0-1.0,
        "symptoms": ["ìtàn1", "ìtàn2"],
        "reasoning": "ìtọ́kasí kíkùn tókan ohùn tí a ríi"
