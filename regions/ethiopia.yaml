id: ethiopia
name: "Ethiopia"
displayName:
  en: "Ethiopia"
  am: "ኢትዮጵያ"
isoCode: "ET"
timezone: "Africa/Addis_Ababa"
languages:
  - code: "en"
    name: "English"
    nativeName: "English"
    rtl: false
  - code: "am"
    name: "Amharic"
    nativeName: "አማርኛ"
    rtl: false
  - code: "om"
    name: "Oromo"
    nativeName: "Afaan Oromoo"
    rtl: false
defaultLanguage: "en"
currency: "ETB"
coordinates:
  latMin: 3.4
  latMax: 14.9
  lonMin: 32.9
  lonMax: 48.0
crops:
  - id: "wheat"
    name: "Wheat"
    scientificName: "Triticum aestivum"
    localNames:
      en: "Wheat"
      am: "ስንዴ"
      om: "Bisinga"
    growingSeasons: ["meher"]
    diseaseClasses: ["yellow_rust", "stem_rust", "septoria_leaf_blotch"]
    icon: "🌾"
    color: "#D97706"
  - id: "maize"
    name: "Maize"
    scientificName: "Zea mays"
    localNames:
      en: "Maize"
      am: "በቆሎ"
      om: "Boqollo"
    growingSeasons: ["meher"]
    diseaseClasses: ["turcicum_leaf_blight", "fall_armyworm"]
    icon: "🌽"
    color: "#F59E0B"
  - id: "coffee"
    name: "Coffee"
    scientificName: "Coffea arabica"
    localNames:
      en: "Coffee"
      am: "ቡና"
      om: "Buna"
    growingSeasons: ["annual"]
    diseaseClasses: ["coffee_leaf_rust", "coffee_berry_disease"]
    icon: "☕"
    color: "#6B4226"
  - id: "faba_bean"
    name: "Faba Bean"
    scientificName: "Vicia faba"
    localNames:
      en: "Faba Bean"
      am: "ባቄላ"
      om: "Baqelaa"
    growingSeasons: ["meher"]
    diseaseClasses: ["chocolate_spot", "faba_bean_rust"]
    icon: "🫘"
    color: "#16A34A"
diseases:
  - id: "yellow_rust"
    name: "Yellow (Stripe) Rust"
    scientificName: "Puccinia striiformis"
    cropIds: ["wheat"]
    symptoms:
      - "Yellow pustules arranged in stripes along veins"
      - "Yellow powder rubs off easily"
      - "Severe leaf drying in cool, humid weather"
    localNames:
      en: "Yellow Rust"
      am: "ቢጫ ዝግታ"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply propiconazole 25% EC @ 1ml/L at first sign; repeat after 15 days in high pressure. Grow rust-resistant varieties (e.g., Ogolcho, Kingbird)."
    preventiveMeasures:
      - "Resistant varieties"
      - "Timely planting"
      - "Balanced nitrogen"
      - "Weekly scouting in the main rains"
    imageTags: ["yellow_rust", "wheat_rust", "wheat"]
    confidenceThreshold: 0.7
  - id: "stem_rust"
    name: "Stem (Black) Rust"
    scientificName: "Puccinia graminis tritici"
    cropIds: ["wheat"]
    symptoms:
      - "Dark red-brown pustules on stems and sheaths"
      - "Ragged ruptured epidermis"
      - "Lodging and shriveled grain"
    localNames:
      en: "Stem Rust"
      am: "ጥቁር ዝግታ"
    severityLevels: ["high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply propiconazole 25% EC @ 1ml/L immediately at detection; repeat after 15 days. Use Ug99-resistant varieties (e.g., Honqolo, Danda'a)."
    preventiveMeasures:
      - "Stem-rust-resistant varieties"
      - "Early scouting after heading"
      - "Avoid excess nitrogen"
      - "Remove volunteer wheat and barberry"
    imageTags: ["stem_rust", "black_rust", "wheat"]
    confidenceThreshold: 0.75
  - id: "septoria_leaf_blotch"
    name: "Septoria Leaf Blotch"
    scientificName: "Zymoseptoria tritici"
    cropIds: ["wheat"]
    symptoms:
      - "Long, irregular gray-brown streaks between veins"
      - "Tiny black fruiting bodies in lesions"
      - "Lower leaves infected first, moving upward"
    localNames:
      en: "Septoria Blotch"
      am: "የስንዴ ብልሽት"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply tebuconazole or propiconazole @ 1ml/L at flag-leaf emergence. Rotate crops and bury residue."
    preventiveMeasures:
      - "Crop rotation"
      - "Residue incorporation"
      - "Resistant/tolerant varieties"
      - "Avoid dense canopies"
    imageTags: ["septoria", "zymoseptoria", "wheat"]
    confidenceThreshold: 0.7
  - id: "turcicum_leaf_blight"
    name: "Turcicum Leaf Blight"
    scientificName: "Exserohilum turcicum"
    cropIds: ["maize"]
    symptoms:
      - "Long elliptical gray-green lesions"
      - "Tan centers with dark margins"
      - "Progresses from lower leaves upward"
    localNames:
      en: "Turcicum Leaf Blight"
      am: "የበቆሎ ብጉር"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply mancozeb 75% WP @ 2.5g/L or propiconazole 25% EC @ 1ml/L at first lesions; repeat at 15-day intervals."
    preventiveMeasures:
      - "Resistant hybrids"
      - "Rotate with legumes"
      - "Bury residue after harvest"
      - "Avoid overhead irrigation"
    imageTags: ["turcicum_leaf_blight", "exserohilum", "maize"]
    confidenceThreshold: 0.7
  - id: "fall_armyworm"
    name: "Fall Armyworm"
    scientificName: "Spodoptera frugiperda"
    cropIds: ["maize"]
    symptoms:
      - "Ragged holes and window-pane feeding"
      - "Sawdust-like frass in whorls"
      - "Larvae with inverted Y head marking"
    localNames:
      en: "Fall Armyworm"
      am: "የበቆሎ ትል"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply emamectin benzoate 5% SG @ 0.4g/L into whorls in the evening. Scout weekly, spot-treat hotspots, and use pheromone traps for monitoring."
    preventiveMeasures:
      - "Early planting"
      - "Weekly whorl scouting"
      - "Conserve natural enemies"
      - "Push-pull intercropping where feasible"
    imageTags: ["fall_armyworm", "spodoptera", "maize"]
    confidenceThreshold: 0.75
  - id: "coffee_leaf_rust"
    name: "Coffee Leaf Rust"
    scientificName: "Hemileia vastatrix"
    cropIds: ["coffee"]
    symptoms:
      - "Yellow-orange powdery patches under leaves"
      - "Premature leaf drop from lower canopy"
      - "Weakened trees and next-season yield loss"
    localNames:
      en: "Coffee Leaf Rust"
      am: "የቡና ዝግታ"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply copper fungicide before the main rains; systemic triazoles during epidemics. Prune for airflow and manage shade."
    preventiveMeasures:
      - "Protective copper before rains"
      - "Regular pruning and shade management"
      - "Resistant varieties in new plantings"
      - "Balanced fertilization"
    imageTags: ["coffee_leaf_rust", "hemileia", "coffee"]
    confidenceThreshold: 0.75
  - id: "coffee_berry_disease"
    name: "Coffee Berry Disease"
    scientificName: "Colletotrichum kahawae"
    cropIds: ["coffee"]
    symptoms:
      - "Dark, sunken lesions on green berries"
      - "Berries mummify and drop"
      - "Spreads fast in wet, cool highlands"
    localNames:
      en: "Coffee Berry Disease"
      am: "የቡና ተክል በሽታ"
    severityLevels: ["high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply copper-based fungicide at berry set and repeat every 3 weeks in the wet season. Remove mummified berries; use resistant selections."
    preventiveMeasures:
      - "Pre-rains sanitation of mummified berries"
      - "Timed copper program"
      - "Canopy management"
      - "Resistant planting material"
    imageTags: ["coffee_berry_disease", "colletotrichum", "coffee"]
    confidenceThreshold: 0.8
  - id: "chocolate_spot"
    name: "Chocolate Spot"
    scientificName: "Botrytis fabae"
    cropIds: ["faba_bean"]
    symptoms:
      - "Small chocolate-brown spots on leaves and stems"
      - "Spots merge into large blighted areas in wet weather"
      - "Flower and pod abortion"
    localNames:
      en: "Chocolate Spot"
      am: "ቸኮሌት ነጥብ"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply chlorothalonil 75% WP @ 2g/L at first lesions and repeat at 10–14 days in wet spells. Ensure good drainage and spacing."
    preventiveMeasures:
      - "Well-drained seedbeds"
      - "Avoid dense sowing"
      - "Resistant varieties where available"
      - "Rotate with cereals"
    imageTags: ["chocolate_spot", "botrytis", "faba_bean"]
    confidenceThreshold: 0.7
  - id: "faba_bean_rust"
    name: "Faba Bean Rust"
    scientificName: "Uromyces viciae-fabae"
    cropIds: ["faba_bean"]
    symptoms:
      - "Small orange-brown pustules on leaves and stems"
      - "Powdery spores that rub off"
      - "Early leaf drop and shriveled seed"
    localNames:
      en: "Faba Bean Rust"
      am: "የባቄላ ዝግታ"
    severityLevels: ["medium"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply mancozeb 75% WP @ 2.5g/L or rust-active triazole at first pustules. Destroy volunteer faba plants and old residue."
    preventiveMeasures:
      - "Timely planting to escape peak rust"
      - "Remove volunteer hosts"
      - "Crop rotation"
      - "Resistant varieties where available"
    imageTags: ["faba_bean_rust", "uromyces", "faba_bean"]
    confidenceThreshold: 0.7
weatherSources:
  - id: "open-meteo"
    name: "Open-Meteo"
    type: "open-meteo"
    baseUrl: "https://api.open-meteo.com/v1"
    rateLimit:
      requestsPerMinute: 60
      requestsPerDay: 10000
    parameters:
      models: "best_match"
      timezone: "Africa/Addis_Ababa"
  - id: "nasa-power"
    name: "NASA POWER"
    type: "nasa-power"
    baseUrl: "https://power.larc.nasa.gov/api/temporal/daily/point"
    rateLimit:
      requestsPerMinute: 30
      requestsPerDay: 1000
    parameters:
      community: "AG"
      format: "JSON"
satelliteSources:
  - id: "sentinel-2"
    name: "Sentinel-2"
    type: "sentinel-2"
    baseUrl: "https://services.sentinel-hub.com"
    apiKeyEnvVar: "SENTINEL_HUB_API_KEY"
    bands: ["B02", "B03", "B04", "B08", "B11", "B12"]
    resolution: 10
    revisitDays: 5
    cloudCoverThreshold: 30
providers:
  - id: "gemini-1"
    name: "Google Gemini"
    type: "gemini"
    baseUrl: "https://generativelanguage.googleapis.com"
    apiKeyEnvVar: "GEMINI_API_KEY"
    models:
      gemini-1.5-flash:
        id: "gemini-1.5-flash"
        taskTypes: ["disease-detection", "yield-prediction", "advisory", "chat"]
        maxTokens: 8192
        temperature: 0.4
        costPer1kTokens: 0.0
    rateLimit:
      requestsPerMinute: 60
      requestsPerDay: 1500
      tokensPerMinute: 32000
    regions: ["ethiopia"]
    priority: 100
    enabled: true
  - id: "groq-1"
    name: "Groq"
    type: "groq"
    baseUrl: "https://api.groq.com/openai/v1"
    apiKeyEnvVar: "GROQ_API_KEY"
    models:
      llama-3.1-70b-versatile:
        id: "llama-3.1-70b-versatile"
        taskTypes: ["advisory", "chat", "yield-prediction"]
        maxTokens: 8192
        temperature: 0.3
        costPer1kTokens: 0.0
    rateLimit:
      requestsPerMinute: 30
      requestsPerDay: 6000
      tokensPerMinute: 6000
    regions: ["ethiopia"]
    priority: 90
    enabled: true
promptTemplates:
  - id: "disease-detection-en"
    taskType: "disease-detection"
    language: "en"
    systemPrompt: |
      You are an expert plant pathologist specializing in crop diseases in Ethiopia.
      Analyze the crop image and identify the disease with high accuracy.
      Respond ONLY with valid JSON in this exact format:
      {
        "disease_id": "string (from provided list)",
        "confidence": 0.0-1.0,
        "symptoms": ["symptom1", "symptom2"],
        "reasoning": "brief explanation of visual evidence"
      }
    userPromptTemplate: "Identify the disease in this {crop} image from {region}. Possible diseases: {disease_list}. Consider symptoms like leaf spots, discoloration, wilting, lesions, or pest damage."
    outputFormat: "json"
  - id: "advisory-am"
    taskType: "advisory"
    language: "am"
    systemPrompt: |
      እርስዎ ለኢትዮጵያ ገበሬዎች የግብርና ᧊ውክ ኦፊሰር ነዎት።
      ተግባራዊ እና አቅም ያለው የሕክምና ምክር ይስጡ።
      በትክክለኛ JSON ብቻ ይመልሱ:
      {
        "treatment": "ደረጃ በደረጃ ሕክምና",
        "preventive_measures": ["እርምጃ1", "እርምጃ2"],
        "follow_up": "መልስ ለመመርመር ጊዜ",
        "safety_warnings": ["ማስጠንቀቂያ1", "ማስጠንቀቂያ2"]
      }
    userPromptTemplate: |
      ለ{disease} በ{crop} ({region}) ሕክምና ምክር ይስጡ።
      ክብደት: {severity}። ቋንቋ: {language}።
      ምልክቶች: {symptoms}
    outputFormat: "json"
modelConfig:
  edgeModelVersion: "v1.1.0"
  edgeModelUrl: "https://cdn.agrisense.app/models/ethiopia-v1.1.0.tflite"
  edgeModelHash: "sha256:placeholder_hash_replace_with_actual"
  inputSize: 224
  confidenceThreshold: 0.7
  topK: 5
caching:
  diseaseDetectionTtlSeconds: 3600
  yieldPredictionTtlSeconds: 86400
  weatherTtlSeconds: 1800
  satelliteTtlSeconds: 43200
metadata:
  version: "1.0.0"
  lastUpdated: "2026-09-27T00:00:00Z"
  maintainer: "AgriSense Team"
  notes: "Ethiopia region configuration: wheat, maize, coffee and faba bean; Amharic and Oromo support."
