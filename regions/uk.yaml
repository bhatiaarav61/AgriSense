id: uk
name: "United Kingdom"
displayName:
  en: "United Kingdom"
isoCode: "GB"
timezone: "Europe/London"
languages:
  - code: "en"
    name: "English"
    nativeName: "English"
    rtl: false
defaultLanguage: "en"
currency: "GBP"
coordinates:
  latMin: 49.9
  latMax: 60.9
  lonMin: -8.2
  lonMax: 1.8
crops:
  - id: "wheat"
    name: "Wheat"
    scientificName: "Triticum aestivum"
    localNames:
      en: "Wheat"
    growingSeasons: ["winter", "spring"]
    diseaseClasses: ["septoria_leaf_blotch", "yellow_rust"]
    icon: "🌾"
    color: "#D97706"
  - id: "barley"
    name: "Barley"
    scientificName: "Hordeum vulgare"
    localNames:
      en: "Barley"
    growingSeasons: ["winter", "spring"]
    diseaseClasses: ["barley_powdery_mildew", "barley_net_blotch"]
    icon: "🌿"
    color: "#65A30D"
  - id: "potato"
    name: "Potato"
    scientificName: "Solanum tuberosum"
    localNames:
      en: "Potato"
    growingSeasons: ["spring"]
    diseaseClasses: ["potato_late_blight"]
    icon: "🥔"
    color: "#A16207"
  - id: "rapeseed"
    name: "Oilseed Rape"
    scientificName: "Brassica napus"
    localNames:
      en: "Oilseed Rape"
    growingSeasons: ["winter"]
    diseaseClasses: ["phoma_stem_canker"]
    icon: "🌼"
    color: "#FACC15"
diseases:
  - id: "septoria_leaf_blotch"
    name: "Septoria Leaf Blotch"
    scientificName: "Zymoseptoria tritici"
    cropIds: ["wheat"]
    symptoms:
      - "Gray-brown streaks limited by leaf veins"
      - "Tiny black pycnidia embedded in lesions"
      - "Lower leaves first, moving to the flag leaf"
    localNames:
      en: "Septoria"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Follow the AHDB T1/T2 program with authorized fungicides, alternating FRAC groups; choose septoria-resistant varieties."
    preventiveMeasures:
      - "Resistant varieties"
      - "Bury crop debris"
      - "Varied drilling dates"
      - "Monitor T0–T2 timings"
    imageTags: ["septoria", "zymoseptoria", "wheat"]
    confidenceThreshold: 0.7
  - id: "yellow_rust"
    name: "Yellow Rust"
    scientificName: "Puccinia striiformis"
    cropIds: ["wheat"]
    symptoms:
      - "Yellow pustules in stripes along veins"
      - "Yellow spore dust rubs off"
      - "Favored by cool springs"
    localNames:
      en: "Yellow Rust"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply an authorized azole at first foci; treat early — yellow rust moves fast. Check current variety rust ratings."
    preventiveMeasures:
      - "Resistant varieties"
      - "Early scouting from March"
      - "Timely T0 sprays in risk varieties"
    imageTags: ["yellow_rust", "wheat_rust", "wheat"]
    confidenceThreshold: 0.7
  - id: "barley_powdery_mildew"
    name: "Barley Powdery Mildew"
    scientificName: "Blumeria graminis f.sp. hordei"
    cropIds: ["barley"]
    symptoms:
      - "White fluffy patches turning gray-brown"
      - "Black cleistothecia specks in old patches"
      - "Lush crops with high nitrogen"
    localNames:
      en: "Powdery Mildew"
    severityLevels: ["low", "medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply an authorized mildewicide (e.g., morpholine mix) when >10% of the upper canopy is affected; balance nitrogen inputs."
    preventiveMeasures:
      - "Resistant varieties"
      - "Moderate nitrogen"
      - "Early scouting"
    imageTags: ["powdery_mildew", "blumeria", "barley"]
    confidenceThreshold: 0.7
  - id: "barley_net_blotch"
    name: "Net Blotch"
    scientificName: "Pyrenophora teres"
    cropIds: ["barley"]
    symptoms:
      - "Net-patterned dark streaks enlarging to blotches"
      - "Yellow halos"
      - "Seed- and stubble-borne"
    localNames:
      en: "Net Blotch"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Certified seed plus an authorized fungicide at T1–T2 when disease moves up the canopy; rotate out of barley."
    preventiveMeasures:
      - "Certified seed"
      - "Rotation"
      - "Residue management"
    imageTags: ["net_blotch", "pyrenophora", "barley"]
    confidenceThreshold: 0.7
  - id: "potato_late_blight"
    name: "Potato Late Blight"
    scientificName: "Phytophthora infestans"
    cropIds: ["potato"]
    symptoms:
      - "Brown water-soaked leaf lesions with white mold ring below"
      - "Very rapid spread in cool humid weather"
      - "Tuber rot"
    localNames:
      en: "Late Blight"
    severityLevels: ["high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Use blight-alert services (e.g., Hutton Criteria) and apply authorized blight fungicides protectively at 7–10 day intervals in risk periods; destroy cull piles and volunteers."
    preventiveMeasures:
      - "Certified seed"
      - "Destroy cull piles and volunteers"
      - "Protective fungicide calendar"
      - "Timely haulm destruction"
    imageTags: ["late_blight", "phytophthora", "potato"]
    confidenceThreshold: 0.75
weatherSources:
  - id: "open-meteo"
    name: "Open-Meteo"
    type: "open-meteo"
    baseUrl: "https://api.open-meteo.com/v1"
    rateLimit:
      requestsPerMinute: 60
      requestsPerDay: 10000
    parameters:
      models: "best_match"
      timezone: "Europe/London"
satelliteSources:
  - id: "sentinel-2"
    name: "Sentinel-2"
    type: "sentinel-2"
    baseUrl: "https://services.sentinel-hub.com"
    apiKeyEnvVar: "SENTINEL_HUB_API_KEY"
    bands: ["B02", "B03", "B04", "B08", "B11", "B12"]
    resolution: 10
    revisitDays: 5
    cloudCoverThreshold: 30
providers:
  - id: "gemini-1"
    name: "Google Gemini"
    type: "gemini"
    baseUrl: "https://generativelanguage.googleapis.com"
    apiKeyEnvVar: "GEMINI_API_KEY"
    models:
      gemini-1.5-flash:
        id: "gemini-1.5-flash"
        taskTypes: ["disease-detection", "yield-prediction", "advisory", "chat"]
        maxTokens: 8192
        temperature: 0.4
        costPer1kTokens: 0.0
    rateLimit:
      requestsPerMinute: 60
      requestsPerDay: 1500
      tokensPerMinute: 32000
    regions: ["uk"]
    priority: 100
    enabled: true
  - id: "openrouter-1"
    name: "OpenRouter"
    type: "openrouter"
    baseUrl: "https://openrouter.ai/api/v1"
    apiKeyEnvVar: "OPENROUTER_API_KEY"
    models:
      google/gemini-flash-1.5:
        id: "google/gemini-flash-1.5"
        taskTypes: ["disease-detection", "yield-prediction", "advisory", "chat"]
        maxTokens: 8192
        temperature: 0.4
        costPer1kTokens: 0.0
    rateLimit:
      requestsPerMinute: 20
      requestsPerDay: 500
    regions: ["uk"]
    priority: 60
    enabled: true
promptTemplates:
  - id: "disease-detection-en"
    taskType: "disease-detection"
    language: "en"
    systemPrompt: |
      You are an expert plant pathologist specializing in crop diseases in the United Kingdom.
      Analyze the crop image and identify the disease with high accuracy.
      Respond ONLY with valid JSON in this exact format:
      {
        "disease_id": "string (from provided list)",
        "confidence": 0.0-1.0,
        "symptoms": ["symptom1", "symptom2"],
        "reasoning": "brief explanation of visual evidence"
      }
    userPromptTemplate: "Identify the disease in this {crop} image from {region}. Possible diseases: {disease_list}. Consider symptoms like leaf spots, discoloration, wilting, lesions, or pest damage."
    outputFormat: "json"
  - id: "advisory-en"
    taskType: "advisory"
    language: "en"
    systemPrompt: |
      You are an ADAS-style agronomy adviser for UK growers.
      Give practical, economical, UK-approval-compliant advice (IPM first).
      Respond ONLY with valid JSON:
      {
        "treatment": "step-by-step treatment instructions",
        "preventive_measures": ["measure1", "measure2"],
        "follow_up": "when to re-check and next steps",
        "safety_warnings": ["warning1", "warning2"]
      }
    userPromptTemplate: |
      Provide a recommendation for {disease} in {crop} ({region}).
      Severity: {severity}. Language: {language}.
      Symptoms: {symptoms}
      Local names: {local_names}
    outputFormat: "json"
modelConfig:
  edgeModelVersion: "v1.1.0"
  edgeModelUrl: "https://cdn.agrisense.app/models/uk-v1.1.0.tflite"
  edgeModelHash: "sha256:placeholder_hash_replace_with_actual"
  inputSize: 224
  confidenceThreshold: 0.7
  topK: 5
caching:
  diseaseDetectionTtlSeconds: 3600
  yieldPredictionTtlSeconds: 86400
  weatherTtlSeconds: 1800
  satelliteTtlSeconds: 43200
metadata:
  version: "1.0.0"
  lastUpdated: "2026-09-27T00:00:00Z"
  maintainer: "AgriSense Team"
  notes: "United Kingdom region configuration: wheat, barley, potato and oilseed rape; English support."
