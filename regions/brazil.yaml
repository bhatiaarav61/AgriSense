    scientificName: "Phakopsora pachyrhizi"
    cropIds: ["soybean"]
    symptoms:
      - "Small tan lesions on lower leaves"
      - "Lesions develop into pustules (uredinia)"
      - "Rust-colored spores on underside"
      - "Premature defoliation"
      - "Severe yield loss if early infection"
