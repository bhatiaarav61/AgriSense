    preventiveMeasures:
      - "Plantio precoce (janela de plantio)"
      - "Cultivares com resistência genética (Rpp genes)"
      - "Rotação de culturas (milho, algodão)"
      - "Eliminação de plantas voluntárias (tigueras)"
      - "Vazio sanitário obrigatório (60-90 dias)"
