      en: "Sugarcane Mosaic"
    severityLevels: ["low", "medium"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Use toletes livres de vírus. Controle de vetores (pulgões) com inseticidas sistêmicos. Elimine plantas voluntárias e hospedeiras alternativas. Variedades resistentes."
    preventiveMeasures:
      - "Toletes sadios"
      - "Controle de pulgões"
      - "Eliminação de plantas voluntárias"
      - "Variedades resistentes"
    imageTags: ["sugarcane_mosaic", "virus", "aphid", "sugarcane"]
    confidenceThreshold: 0.65
  - id: "pokkah_boeng_sugarcane"
    name: "Pokkah Boeng"
    scientificName: "Fusarium moniliforme"
    cropIds: ["sugarcane"]
    symptoms:
      - "Folhas do topo torcidas e deformadas"
      - "Estrias cloróticas e necróticas nas folhas"
      - "Crescimento atrofiado, aspecto 'leque'"
      - "Descoloração avermelhada interna do colmo"
    localNames:
      pt: "Pokkah Boeng"
      en: "Pokkah Boeng"
    severityLevels: ["low", "medium"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Geralmente autolimitante. Remova topos severamente afetados. Tratamento de toletes com carbendazim 50% WP @ 1g/L. Nutrição balanceada reduz severidade."
    preventiveMeasures:
      - "Toletes sadios"
      - "Adubação balanceada"
      - "Evite encharcamento"
    imageTags: ["pokkah_boeng", "fusarium", "sugarcane"]
    confidenceThreshold: 0.6
  - id: "ratoon_stunting"
    name: "Ratoon Stunting Disease"
    scientificName: "Leifsonia xyli subsp. xyli"
    cropIds: ["sugarcane"]
    symptoms:
      - "Crescimento atrofiado na soqueira"
      - "Encurtamento de entrenós"
      - "Folhas amarelas, finas"
      - "Sem sintomas externos óbvios na cana-planta"
    localNames:
      pt: "Raquitismo da Soqueira"
      en: "Ratoon Stunting Disease"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Tratamento térmico de toletes (50°C por 2-3 horas). Desinfecção de ferramentas de corte. Use variedades resistentes. Renovação do canavial."
    preventiveMeasures:
      - "Tratamento térmico de toletes"
      - "Desinfecção de ferramentas"
      - "Variedades resistentes"
      - "Renovação periódica"
    imageTags: ["ratoon_stunting", "leifsonia", "sugarcane"]
    confidenceThreshold: 0.75
  - id: "cotton_leaf_curl_br"
    name: "Cotton Leaf Curl Disease"
    scientificName: "Cotton leaf curl virus (CLCuV) complex"
    cropIds: ["cotton"]
    symptoms:
      - "Enrolamento das folhas (para cima/baixo)"
      - "Espessamento e inchamento das nervuras"
      - "Enções (crescimentos foliares) nas nervuras"
      - "Crescimento atrofiado, maçãs reduzidas"
      - "Transmitido por mosca-branca (Bemisia tabaci)"
    localNames:
      pt: "Enrolamento Foliar do Algodoeiro"
      en: "Cotton Leaf Curl Disease"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Manejo de mosca-branca com diafenthiuron 50% WP @ 0.6g/L ou spiromesifeno 22.9% SC @ 1ml/L. Elimine plantas doentes precocemente. Use variedades tolerantes (Bt resistentes)."
    preventiveMeasures:
      - "Variedades Bt tolerantes"
      - "Plantio precoce (evita pico de mosca-branca)"
      - "Eliminação de hospedeiras alternativas"
      - "Armadilhas adesivas amarelas"
      - "Rotação com não-hospedeiras"
    imageTags: ["cotton_leaf_curl", "clcuv", "whitefly", "cotton"]
    confidenceThreshold: 0.75
  - id: "bacterial_blight_cotton"
    name: "Bacterial Blight (Cotton)"
    scientificName: "Xanthomonas citri pv. malvacearum"
    cropIds: ["cotton"]
    symptoms:
      - "Manchas angulares aquosas nas folhas"
      - "Manchas tornam-se marrons com bordas vermelhas"
      - "Cancros negros nas hastes (black arm)"
      - "Podridão de maçã com lesões aquosas"
    localNames:
      pt: "Bacteriose do Algodoeiro"
      en: "Bacterial Blight"
    severityLevels: ["low", "medium", "high"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Aplique oxicloreto de cobre 50% WP @ 2.5g/L ou estreptomicina + tetraciclina @ 1g/L. Pulverize em intervalos de 10-15 dias. Evite irrigação por aspersão."
    preventiveMeasures:
      - "Sementes deslintadas com ácido"
      - "Tratamento de sementes com estreptomicina"
      - "Rotação de culturas (2-3 anos)"
      - "Evite irrigação por aspersão"
      - "Destruição de restos culturais"
    imageTags: ["bacterial_blight", "xanthomonas", "cotton"]
    confidenceThreshold: 0.7
  - id: "target_spot_cotton"
    name: "Target Spot"
    scientificName: "Corynespora cassiicola"
    cropIds: ["cotton"]
    symptoms:
      - "Manchas com anéis concêntricos (alvo)"
      - "Lesões grandes com margens definidas"
      - "Centro cinza com bordas escuras"
      - "Desfolha precoce severa"
    localNames:
      pt: "Mancha Alvo do Algodoeiro"
      en: "Target Spot"
    severityLevels: ["low", "medium", "high"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Aplique fungicidas multissítio + sítio específico (azoxistrobina, bixafeno, piraclostrobina) no fechamento de entrelinhas. Manejo de irrigação. Variedades tolerantes."
    preventiveMeasures:
      - "Variedades tolerantes"
      - "Espaçamento adequado"
      - "Rotação com gramíneas"
      - "Manejo de irrigação (evite aspersão)"
    imageTags: ["target_spot", "corynespora", "cotton"]
    confidenceThreshold: 0.7
  - id: "verticillium_wilt"
    name: "Verticillium Wilt"
    scientificName: "Verticillium dahliae"
    cropIds: ["cotton"]
    symptoms:
      - "Amarelecimento e murcha das folhas basais"
      - "Descoloração vascular marrom no caule"
      - "Plantas atrofiadas, morte precoce"
      - "Mais severo em solos frios/úmidos"
    localNames:
      pt: "Murcha de Verticillium"
      en: "Verticillium Wilt"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Não há controle químico eficaz. Solarização do solo no verão. Use variedades resistentes. Aplique Trichoderma viride @ 2.5kg/ha com esterco na semeadura."
    preventiveMeasures:
      - "Variedades resistentes"
      - "Rotação de culturas (3-4 anos com não-hospedeiras)"
      - "Solarização do solo"
      - "Tratamento de sementes com Trichoderma"
      - "Evite ferimento de raízes"
    imageTags: ["verticillium_wilt", "verticillium", "cotton"]
    confidenceThreshold: 0.7
  - id: "root_knot_nematode"
    name: "Root-Knot Nematode"
    scientificName: "Meloidogyne incognita / M. javanica"
    cropIds: ["cotton"]
    symptoms:
      - "Galhas nas raízes (nódulos)"
      - "Plantas atrofiadas, amareladas"
      - "Murcha em dias quentes"
      - "Redução severa de produtividade"
    localNames:
      pt: "Nematóide-das-galhas"
      en: "Root-Knot Nematode"
    severityLevels: ["high"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Tratamento de sementes com abamectina ou fluopiram. Rotação com culturas não-hospedeiras (gramíneas, braquiária). Adubação orgânica. Solarização."
    preventiveMeasures:
      - "Rotação com gramíneas/braquiária"
      - "Tratamento de sementes nematicida"
      - "Adubação orgânica"
      - "Solarização do solo"
      - "Variedades resistentes"
    imageTags: ["root_knot_nematode", "meloidogyne", "cotton"]
    confidenceThreshold: 0.8
  - id: "boll_rot"
    name: "Boll Rot"
    scientificName: "Fusarium spp. / Colletotrichum spp. / Aspergillus spp."
    cropIds: ["cotton"]
    symptoms:
      - "Manchas aquosas nas maçãs jovens"
      - "Maçãs tornam-se marrons/pretas"
      - "Fibras manchadas, qualidade reduzida"
      - "Queda de maçãs"
    localNames:
      pt: "Podridão de Maçã"
      en: "Boll Rot"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "Para {disease} em {crop} ({region}): Controle de insetos sugadores (percevejos). Fungicidas no florescimento (azoxistrobina + ciproconazol). Colheita na época. Evite excesso de nitrogênio tardio."
    preventiveMeasures:
      - "Controle de percevejos"
      - "Fungicidas no florescimento"
      - "Colheita na época"
      - "Nitrogênio balanceado"
    imageTags: ["boll_rot", "fusarium", "colletotrichum", "cotton"]
    confidenceThreshold: 0.7
