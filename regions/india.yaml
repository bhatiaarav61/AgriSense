      ta: "பாக்டீரியா வில்ட்"
      te: "బాక్టీరియల్ విల్ట్"
      bn: "ব্যাকটেরিয়াল উইল্ট"
      mr: "जीवाणू विल्ट"
      gu: "બેક્ટેરિયલ વિલ્ટ"
      kn: "ಬ್ಯಾಕ್ಟೀರಿಯಲ್ ವಿಲ್ಟ್"
      ml: "ബാക്ടീരിയൽ വിൽട്ട്"
