diseases:
  - id: "bacterial_leaf_blight"
    name: "Bacterial Leaf Blight"
    scientificName: "Xanthomonas oryzae pv. oryzae"
    cropIds: ["rice"]
    symptoms:
      - "Water-soaked lesions on leaves"
      - "Yellow to white stripes along leaf veins"
      - "Leaves drying from tip to base"
      - "Wilting of seedlings (kresek phase)"
    localNames:
      en: "Bacterial Leaf Blight"
      hi: "जीवाणु पत्ती झुलसा"
      ta: "பாக்டீரியா இலை வெறிப்பு"
      te: "బాక్టీరియల్ లీఫ్ బ్లైట్"
      bn: "ব্যাকটেরিয়াল লিফ ব্লাইট"
      mr: "जीवाणू पान झुलसा"
      gu: "બેક્ટેરિયલ પાત્ર અવનमन"
      kn: "ಬ್ಯಾಕ್ಟೀರಿಯಲ್ ಲೀಫ್ ಬ್ಲೈಟ್"
      ml: "ബാക്ടീരിയൽ ലീഫ് ബ്ലൈറ്റ്"
      pa: "ਬੈਕਟੇਰിയਲ ਲੀਫ ਬਲਾਈਟ"
    severityLevels: ["low", "medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply copper-based bactericides (copper oxychloride 50% WP @ 2.5g/L) at first sign. Repeat at 10-15 day intervals. Ensure field drainage. Use resistant varieties like Swarna Sub1, Improved Samba Mahsuri. Avoid excess nitrogen."
    preventiveMeasures:
      - "Use certified disease-free seeds"
      - "Treat seeds with streptomycin sulphate (1g/kg seed)"
      - "Maintain proper field sanitation"
      - "Avoid continuous rice cultivation"
      - "Balance fertilizer application (avoid excess N)"
    imageTags: ["bacterial_leaf_blight", "rice", "xanthomonas"]
    confidenceThreshold: 0.75

