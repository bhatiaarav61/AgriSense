    imageTags: ["potato_virus_y", "pvy", "aphid", "potato"]
    confidenceThreshold: 0.7

  - id: "common_scab"
    name: "Common Scab"
    scientificName: "Streptomyces scabies"
    cropIds: ["potato"]
    symptoms:
