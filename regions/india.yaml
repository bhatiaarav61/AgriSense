    severityLevels: ["low", "medium"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Maintain soil pH 5.0-5.2 (acidic). Adequate soil moisture during tuber initiation (6-8 weeks after planting). Use resistant varieties (e.g., Kufri Jyoti, Kufri Chipsona). Apply organic matter."
