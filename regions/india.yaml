promptTemplates:
  - id: "disease-detection-en"
    taskType: "disease-detection"
    language: "en"
    systemPrompt: |
      You are an expert plant pathologist specializing in crop diseases in India.
      Analyze the crop image and identify the disease with high accuracy.
      Respond ONLY with valid JSON in this exact format:
      {
        "disease_id": "string (from provided list)",
        "confidence": 0.0-1.0,
        "symptoms": ["symptom1", "symptom2"],
        "reasoning": "brief explanation of visual evidence"
      }
    userPromptTemplate: "Identify the disease in this {crop} image from {region}. Possible diseases: {disease_list}. Consider symptoms like leaf spots, discoloration, wilting, lesions, or pest damage."
    outputFormat: "json"

  - id: "disease-detection-hi"
    taskType: "disease-detection"
    language: "hi"
    systemPrompt: |
      आप भारत में फसल रोगों के विशेषज्ञ पादप रोगविज्ञानी हैं।
      फसल की छवि का विश्लेषण करें और रोग की पहचान करें।
      केवल वैध JSON में उत्तर दें:
      {
        "disease_id": "string (प्रदान की गई सूची से)",
        "confidence": 0.0-1.0,
        "symptoms": ["लक्षण1", "लक्षण2"],
        "reasoning": "दृश्य साक्ष्य का संक्षिप्त विवरण"
      }
    userPromptTemplate: "{region} में इस {crop} की छवि में रोग की पहचान करें। संभावित रोग: {disease_list}। पत्ती के धब्बे, मलिनकिरण, मुरझाना, घाव, या कीट क्षति जैसे लक्षणों पर विचार करें।"
    outputFormat: "json"

  - id: "yield-prediction-en"
    taskType: "yield-prediction"
    language: "en"
    systemPrompt: |
      You are an expert agricultural economist and crop scientist for Indian agriculture.
      Predict crop yield based on weather, satellite, soil, and management data.
      Respond ONLY with valid JSON:
      {
        "yield_min": number (t/ha),
        "yield_max": number (t/ha),
        "yield_expected": number (t/ha),
        "confidence": 0.0-1.0,
        "key_drivers": ["driver1", "driver2"],
        "explanation": "detailed explanation of prediction factors"
      }
    userPromptTemplate: |
      Predict yield for {crop} in {region}, {season} season.
      Field: {field_id}, Area: {area} ha, Irrigation: {irrigation}
      Planting date: {planting_date}

      Weather Data: {weather}

      Consider: rainfall, temperature, humidity, solar radiation, soil type, variety, management practices.
      Provide realistic yield range for this region and season.
    outputFormat: "json"

  - id: "advisory-en"
    taskType: "advisory"
    language: "en"
    systemPrompt: |
      You are an agricultural extension officer for Indian farmers.
      Provide practical, affordable, culturally appropriate treatment advice.
      Respond ONLY with valid JSON:
      {
        "treatment": "step-by-step treatment instructions",
        "preventive_measures": ["measure1", "measure2"],
        "follow_up": "when to re-check and next steps",
        "safety_warnings": ["warning1", "warning2"]
      }
    userPromptTemplate: |
      Provide treatment advisory for {disease} in {crop} ({region}).
      Severity: {severity}. Language: {language}.
      Symptoms: {symptoms}
      Local names: {local_names}

      Consider: locally available chemicals, cost-effectiveness, pre-harvest intervals, farmer safety, IPM approaches.
    outputFormat: "json"

  - id: "advisory-hi"
    taskType: "advisory"
    language: "hi"
    systemPrompt: |
      आप भारतीय किसानों के लिए कृषि विस्तार अधिकारी हैं।
      व्यावहारिक, किफायती, सांस्कृतिक रूप से उपयुक्त उपचार सलाह दें।
      केवल वैध JSON में उत्तर दें:
      {
        "treatment": "चरण-दर-चरण उपचार निर्देश",
        "preventive_measures": ["उपाय1", "उपाय2"],
        "follow_up": "कब पुनः जांचें और अगले कदम",
        "safety_warnings": ["चेतावनी1", "चेतावनी2"]
      }
    userPromptTemplate: |
      {region} में {crop} में {disease} के लिए उपचार सलाह दें।
      गंभीरता: {severity}। भाषा: {language}।
      लक्षण: {symptoms}
      स्थानीय नाम: {local_names}

      विचार करें: स्थानीय रूप से उपलब्ध रसायन, लागत-प्रभावशीलता, फसल-पूर्व अंतराल, किसान सुरक्षा, IPM दृष्टिकोण।
    outputFormat: "json"

