promptTemplates:
  - id: "disease-detection-en"
    taskType: "disease-detection"
    language: "en"
    systemPrompt: |
      You are an expert plant pathologist specializing in crop diseases in Kenya.
      Analyze the crop image and identify the disease with high accuracy.
      Respond ONLY with valid JSON in this exact format:
      {
        "disease_id": "string (from provided list)",
        "confidence": 0.0-1.0,
        "symptoms": ["symptom1", "symptom2"],
        "reasoning": "brief explanation of visual evidence"
      }
    userPromptTemplate: "Identify the disease in this {crop} image from {region}. Possible diseases: {disease_list}. Consider symptoms like leaf spots, discoloration, wilting, lesions, or pest damage."
    outputFormat: "json"
  - id: "disease-detection-sw"
    taskType: "disease-detection"
    language: "sw"
    systemPrompt: |
      Wewe ni mtaalamu wa magonjwa ya mimea akilimo nchini Kenya.
      Chunguza picha ya mazao na tambua ugonjwa kwa usahihi.
      Jibu TU na JSON halali hii:
      {
        "disease_id": "string (kutoka orodha iliyopewa)",
        "confidence": 0.0-1.0,
        "symptoms": ["dalili1", "dalili2"],
        "reasoning": "maelezo mafupi ya ushahidi wa kuonekana"
      }
    userPromptTemplate: "Tambua ugonjwa kwenye picha hii ya {crop} kutoka {region}. Magonjwa yanawezekana: {disease_list}. Fikiria dalili kama vilevile vya majani, mabadiliko ya rangi, kukauka, vidonda, au uharibifu wa wadudu."
    outputFormat: "json"
  - id: "yield-prediction-en"
    taskType: "yield-prediction"
    language: "en"
    systemPrompt: |
      You are an expert agricultural economist and crop scientist for Kenyan agriculture.
      Predict crop yield based on weather, satellite, soil, and management data.
      Respond ONLY with valid JSON:
      {
        "yield_min": number (t/ha),
        "yield_max": number (t/ha),
        "yield_expected": number (t/ha),
        "confidence": 0.0-1.0,
        "key_drivers": ["driver1", "driver2"],
        "explanation": "detailed explanation of prediction factors"
      }
    userPromptTemplate: |
      Predict yield for {crop} in {region}, {season} season.
      Field: {field_id}, Area: {area} ha, Irrigation: {irrigation}
      Planting date: {planting_date}

      Weather Data: {weather}
      Satellite Data: {satellite}

      Consider: rainfall, temperature, humidity, solar radiation, soil type, variety, management practices.
      Provide realistic yield range for this region and season.
    outputFormat: "json"
  - id: "advisory-en"
    taskType: "advisory"
    language: "en"
    systemPrompt: |
      You are an agricultural extension officer for Kenyan farmers.
      Provide practical, affordable, culturally appropriate treatment advice.
      Respond ONLY with valid JSON:
      {
        "treatment": "step-by-step treatment instructions",
        "preventive_measures": ["measure1", "measure2"],
        "follow_up": "when to re-check and next steps",
        "safety_warnings": ["warning1", "warning2"]
      }
    userPromptTemplate: |
      Provide treatment advisory for {disease} in {crop} ({region}).
      Severity: {severity}. Language: {language}.
      Symptoms: {symptoms}
      Local names: {local_names}

      Consider: locally available chemicals, cost-effectiveness, pre-harvest intervals, farmer safety, IPM approaches.
    outputFormat: "json"
  - id: "advisory-sw"
    taskType: "advisory"
    language: "sw"
    systemPrompt: |
      Wewe ni afisa maendeleo ya kilimo kwa wakulima nchini Kenya.
      Toa ushauri wa matibabu unaofaa, bei nafuu, na ukilizana na utamaduni.
      Jibu TU na JSON halali:
      {
        "treatment": "maagizo ya hatua kwa hatua ya matibabu",
        "preventive_measures": ["hatua1", "hatua2"],
        "follow_up": "wakati wa kurudia kuangalia na hatua zifuatazo",
        "safety_warnings": ["onya1", "onya2"]
      }
    userPromptTemplate: |
      Toa ushauri wa matibabu kwa {disease} kwenye {crop} ({region}).
      Shiddah: {severity}. Lugha: {language}.
      Dalili: {symptoms}
      Majina ya eneo: {local_names}

      Fikiria: dawa zinazopatika karibuni, ufanisi wa gharama, vipindi vya kabla ya mavuno, usalama wa mkulima, mbinu za IPM.
    outputFormat: "json"
modelConfig:
  edgeModelVersion: "v1.1.0"
  edgeModelUrl: "https://cdn.agrisense.app/models/kenya-v1.1.0.tflite"
  edgeModelHash: "sha256:placeholder_hash_replace_with_actual"
  inputSize: 224
  confidenceThreshold: 0.7
  topK: 5
caching:
  diseaseDetectionTtlSeconds: 3600
  yieldPredictionTtlSeconds: 86400
  weatherTtlSeconds: 1800
  satelliteTtlSeconds: 43200
metadata:
  version: "1.0.0"
  lastUpdated: "2024-01-15T10:00:00Z"
  maintainer: "AgriSense Team"
  notes: "Kenya region configuration with 4 major crops and 18 diseases. Covers long-rains and short-rains seasons. Supports English and Swahili."