id: ireland
name: "Ireland"
displayName:
  en: "Ireland"
  ga: "Eire"
isoCode: "IE"
timezone: "Europe/Dublin"
languages:
  - code: "en"
    name: "English"
    nativeName: "English"
    rtl: false
  - code: "ga"
    name: "Irish"
    nativeName: "Gaeilge"
    rtl: false
defaultLanguage: "en"
currency: "EUR"
coordinates:
  latMin: 51.4
  latMax: 55.6
  lonMin: -10.7
  lonMax: -5.9
crops:
  - id: "potato"
    name: "Potato"
    scientificName: "Solanum tuberosum"
    localNames:
      en: "Potato"
      ga: "Pratai"
    growingSeasons: ["spring"]
    diseaseClasses: ["potato_late_blight", "blackleg_potato"]
    icon: "🥔"
    color: "#A16207"
  - id: "barley"
    name: "Barley"
    scientificName: "Hordeum vulgare"
    localNames:
      en: "Barley"
      ga: "Eorna"
    growingSeasons: ["spring", "winter"]
    diseaseClasses: ["barley_rhynchosporium", "barley_net_blotch"]
    icon: "🌿"
    color: "#65A30D"
  - id: "wheat"
    name: "Wheat"
    scientificName: "Triticum aestivum"
    localNames:
      en: "Wheat"
      ga: "Cruithneacht"
    growingSeasons: ["winter", "spring"]
    diseaseClasses: ["septoria_leaf_blotch", "yellow_rust"]
    icon: "🌾"
    color: "#D97706"
diseases:
  - id: "potato_late_blight"
    name: "Potato Late Blight"
    scientificName: "Phytophthora infestans"
    cropIds: ["potato"]
    symptoms:
      - "Brown water-soaked leaf lesions with white mold ring beneath"
      - "Extremely rapid spread in the mild humid Irish climate"
      - "Tuber rot in field and store"
    localNames:
      en: "Late Blight"
    severityLevels: ["high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Follow Met Eireann blight warnings and apply an authorized blight fungicide protectively every 7–10 days in risk periods; never skip during blight periods."
    preventiveMeasures:
      - "Certified seed"
      - "Destroy volunteers and cull piles"
      - "Protective fungicide program"
      - "Timely haulm destruction"
    imageTags: ["late_blight", "phytophthora", "potato"]
    confidenceThreshold: 0.75
  - id: "blackleg_potato"
    name: "Blackleg (Potato)"
    scientificName: "Pectobacterium/Dickeya spp."
    cropIds: ["potato"]
    symptoms:
      - "Black, slimy rot of the stem base"
      - "Yellowing, stunted shoots from infected seed"
      - "Wilting and early plant death"
    localNames:
      en: "Blackleg"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): No field cure — rogue out infected plants with surrounding soil; the key is certified, disease-tested seed and dry planting conditions."
    preventiveMeasures:
      - "High-grade certified seed"
      - "Avoid planting in wet, cold soils"
      - "Rogue infected plants early"
      - "Disinfect seed-cutting equipment"
    imageTags: ["blackleg", "pectobacterium", "potato"]
    confidenceThreshold: 0.7
  - id: "barley_rhynchosporium"
    name: "Rhynchosporium (Scald)"
    scientificName: "Rhynchosporium secalis"
    cropIds: ["barley"]
    symptoms:
      - "Gray-green water-soaked lesions with dark scolloped margins"
      - "On leaves and sheaths; worse in damp canopies"
      - "Major yield-limiting disease in Irish barley"
    localNames:
      en: "Rhynchosporium"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply an authorized fungicide (prothioconazole-based programs are standard) at T1 and reassess at T2; choose varieties with good rhynchosporium ratings."
    preventiveMeasures:
      - "Resistant varieties"
      - "Certified seed"
      - "Avoid very dense canopies"
      - "Rotation"
    imageTags: ["rhynchosporium", "scald", "barley"]
    confidenceThreshold: 0.7
  - id: "barley_net_blotch"
    name: "Net Blotch"
    scientificName: "Pyrenophora teres"
    cropIds: ["barley"]
    symptoms:
      - "Net-patterned dark streaks enlarging to brown blotches"
      - "Yellow halos around lesions"
      - "Seed- and stubble-borne"
    localNames:
      en: "Net Blotch"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Certified seed and an authorized fungicide at T1–T2 when disease moves up the canopy; rotate out of barley."
    preventiveMeasures:
      - "Certified seed"
      - "Rotation"
      - "Residue management"
    imageTags: ["net_blotch", "pyrenophora", "barley"]
    confidenceThreshold: 0.7
  - id: "septoria_leaf_blotch"
    name: "Septoria Leaf Blotch"
    scientificName: "Zymoseptoria tritici"
    cropIds: ["wheat"]
    symptoms:
      - "Gray-brown streaks limited by veins"
      - "Black pycnidia in older lesions"
      - "Most important wheat disease in Ireland's wet climate"
    localNames:
      en: "Septoria"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Run a robust T0–T2 fungicide program with varied FRAC groups per Irish guidance; select septoria-resistant varieties."
    preventiveMeasures:
      - "Resistant varieties"
      - "Varied sowing dates"
      - "Bury debris"
      - "Monitor regularly"
    imageTags: ["septoria", "zymoseptoria", "wheat"]
    confidenceThreshold: 0.7
  - id: "yellow_rust"
    name: "Yellow Rust"
    scientificName: "Puccinia striiformis"
    cropIds: ["wheat"]
    symptoms:
      - "Yellow pustules in stripes along veins"
      - "Yellow spore dust"
      - "Favored by cool, humid spells"
    localNames:
      en: "Yellow Rust"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply an authorized azole immediately at first foci — yellow rust escalates quickly; verify current variety ratings."
    preventiveMeasures:
      - "Resistant varieties"
      - "Early scouting from spring"
      - "Timely T0 in risk varieties"
    imageTags: ["yellow_rust", "wheat_rust", "wheat"]
    confidenceThreshold: 0.7
weatherSources:
  - id: "open-meteo"
    name: "Open-Meteo"
    type: "open-meteo"
    baseUrl: "https://api.open-meteo.com/v1"
    rateLimit:
      requestsPerMinute: 60
      requestsPerDay: 10000
    parameters:
      models: "best_match"
      timezone: "Europe/Dublin"
satelliteSources:
  - id: "sentinel-2"
    name: "Sentinel-2"
    type: "sentinel-2"
    baseUrl: "https://services.sentinel-hub.com"
    apiKeyEnvVar: "SENTINEL_HUB_API_KEY"
    bands: ["B02", "B03", "B04", "B08", "B11", "B12"]
    resolution: 10
    revisitDays: 5
    cloudCoverThreshold: 30
providers:
  - id: "gemini-1"
    name: "Google Gemini"
    type: "gemini"
    baseUrl: "https://generativelanguage.googleapis.com"
    apiKeyEnvVar: "GEMINI_API_KEY"
    models:
      gemini-1.5-flash:
        id: "gemini-1.5-flash"
        taskTypes: ["disease-detection", "yield-prediction", "advisory", "chat"]
        maxTokens: 8192
        temperature: 0.4
        costPer1kTokens: 0.0
    rateLimit:
      requestsPerMinute: 60
      requestsPerDay: 1500
      tokensPerMinute: 32000
    regions: ["ireland"]
    priority: 100
    enabled: true
  - id: "openrouter-1"
    name: "OpenRouter"
    type: "openrouter"
    baseUrl: "https://openrouter.ai/api/v1"
    apiKeyEnvVar: "OPENROUTER_API_KEY"
    models:
      google/gemini-flash-1.5:
        id: "google/gemini-flash-1.5"
        taskTypes: ["disease-detection", "yield-prediction", "advisory", "chat"]
        maxTokens: 8192
        temperature: 0.4
        costPer1kTokens: 0.0
    rateLimit:
      requestsPerMinute: 20
      requestsPerDay: 500
    regions: ["ireland"]
    priority: 60
    enabled: true
promptTemplates:
  - id: "disease-detection-en"
    taskType: "disease-detection"
    language: "en"
    systemPrompt: |
      You are an expert plant pathologist specializing in crop diseases in Ireland.
      Analyze the crop image and identify the disease with high accuracy.
      Respond ONLY with valid JSON in this exact format:
      {
        "disease_id": "string (from provided list)",
        "confidence": 0.0-1.0,
        "symptoms": ["symptom1", "symptom2"],
        "reasoning": "brief explanation of visual evidence"
      }
    userPromptTemplate: "Identify the disease in this {crop} image from {region}. Possible diseases: {disease_list}. Consider symptoms like leaf spots, discoloration, wilting, lesions, or pest damage."
    outputFormat: "json"
  - id: "advisory-en"
    taskType: "advisory"
    language: "en"
    systemPrompt: |
      You are a Teagasc-style adviser for Irish growers.
      Give practical, economical, Ireland-approved advice (IPM first).
      Respond ONLY with valid JSON:
      {
        "treatment": "step-by-step treatment instructions",
        "preventive_measures": ["measure1", "measure2"],
        "follow_up": "when to re-check and next steps",
        "safety_warnings": ["warning1", "warning2"]
      }
    userPromptTemplate: |
      Provide a recommendation for {disease} in {crop} ({region}).
      Severity: {severity}. Language: {language}.
      Symptoms: {symptoms}
      Local names: {local_names}
    outputFormat: "json"
modelConfig:
  edgeModelVersion: "v1.1.0"
  edgeModelUrl: "https://cdn.agrisense.app/models/ireland-v1.1.0.tflite"
  edgeModelHash: "sha256:placeholder_hash_replace_with_actual"
  inputSize: 224
  confidenceThreshold: 0.7
  topK: 5
caching:
  diseaseDetectionTtlSeconds: 3600
  yieldPredictionTtlSeconds: 86400
  weatherTtlSeconds: 1800
  satelliteTtlSeconds: 43200
metadata:
  version: "1.0.0"
  lastUpdated: "2026-09-27T00:00:00Z"
  maintainer: "AgriSense Team"
  notes: "Ireland region configuration: potato, barley and wheat; English and Irish (Gaeilge) scaffolding."
