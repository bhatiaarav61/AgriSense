id: usa
name: "United States"
displayName:
  en: "United States"
  es: "Estados Unidos"
isoCode: "US"
timezone: "America/Chicago"
languages:
  - code: "en"
    name: "English"
    nativeName: "English"
    rtl: false
  - code: "es"
    name: "Spanish"
    nativeName: "Español"
    rtl: false
defaultLanguage: "en"
currency: "USD"
coordinates:
  latMin: 24.5
  latMax: 49.4
  lonMin: -125.0
  lonMax: -66.9
crops:
  - id: "corn"
    name: "Corn"
    scientificName: "Zea mays"
    localNames:
      en: "Corn"
      es: "Maíz"
    growingSeasons: ["spring-planted"]
    diseaseClasses: ["gray_leaf_spot", "tar_spot", "common_rust"]
    icon: "🌽"
    color: "#F59E0B"
  - id: "soybean"
    name: "Soybean"
    scientificName: "Glycine max"
    localNames:
      en: "Soybean"
      es: "Soja"
    growingSeasons: ["spring-planted"]
    diseaseClasses: ["soybean_rust", "frogeye_leaf_spot", "brown_spot"]
    icon: "🫘"
    color: "#16A34A"
  - id: "wheat"
    name: "Wheat"
    scientificName: "Triticum aestivum"
    localNames:
      en: "Wheat"
      es: "Trigo"
    growingSeasons: ["winter", "spring"]
    diseaseClasses: ["fusarium_head_blight", "yellow_rust"]
    icon: "🌾"
    color: "#D97706"
diseases:
  - id: "gray_leaf_spot"
    name: "Gray Leaf Spot"
    scientificName: "Cercospora zeae-maydis"
    cropIds: ["corn"]
    symptoms:
      - "Rectangular gray-tan lesions parallel to veins"
      - "Distinct margins with yellow halo"
      - "Lower leaves affected first"
    localNames:
      en: "Gray Leaf Spot"
      es: "Mancha gris de la hoja"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply a labeled fungicide (e.g., azoxystrobin or pyraclostrobin) between VT–R1 when lesions reach the ear leaf. Rotate crops and till residue where appropriate."
    preventiveMeasures:
      - "Resistant hybrids"
      - "2+ year rotation"
      - "Residue management"
      - "Balanced fertility"
    imageTags: ["gray_leaf_spot", "cercospora", "corn"]
    confidenceThreshold: 0.7
  - id: "tar_spot"
    name: "Tar Spot"
    scientificName: "Phyllachora maydis"
    cropIds: ["corn"]
    symptoms:
      - "Small black raised spots (stromata) embedded in leaf tissue"
      - "Fish-eye appearance with dry tan halos later"
      - "Yield loss when canopy infected before R3"
    localNames:
      en: "Tar Spot"
      es: "Mancha de alquitrán"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply a labeled fungicide at VT–R1 when stromata appear on the ear leaf or below before silking; prolonged leaf wetness favors spread."
    preventiveMeasures:
      - "Resistant hybrids"
      - "Rotate crops"
      - "Incorporate residue"
      - "Scout in cool, humid periods"
    imageTags: ["tar_spot", "phyllachora", "corn"]
    confidenceThreshold: 0.7
  - id: "common_rust"
    name: "Common Rust"
    scientificName: "Puccinia sorghi"
    cropIds: ["corn"]
    symptoms:
      - "Cinnamon-brown pustules scattered on leaves"
      - "Spores rub off as powder"
      - "Favors mild temperatures and high humidity"
    localNames:
      en: "Common Rust"
      es: "Roya común"
    severityLevels: ["low", "medium"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Treat with a labeled fungicide only when pustules are dense before silking on susceptible hybrids; usually minor in most regions."
    preventiveMeasures:
      - "Resistant hybrids"
      - "Timely planting"
      - "Monitor weekly in humid spells"
    imageTags: ["common_rust", "puccinia", "corn"]
    confidenceThreshold: 0.65
  - id: "soybean_rust"
    name: "Asian Soybean Rust"
    scientificName: "Phakopsora pachyrhizi"
    cropIds: ["soybean"]
    symptoms:
      - "Small yellow-tan pustules on lower leaves"
      - "Lesions visible as tiny volcano-like bumps under the leaf"
      - "Rapid premature defoliation"
    localNames:
      en: "Soybean Rust"
      es: "Roya de la soja"
    severityLevels: ["high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply a labeled triazole or strobilurin-based fungicide at first detection or per sentinel-plot warnings; repeat per label in high pressure."
    preventiveMeasures:
      - "Sentinel-plot monitoring"
      - "Early planting to escape"
      - "Resistant varieties where available"
      - "Scout lower canopy first"
    imageTags: ["soybean_rust", "phakopsora", "soybean"]
    confidenceThreshold: 0.75
  - id: "frogeye_leaf_spot"
    name: "Frogeye Leaf Spot"
    scientificName: "Cercospora sojina"
    cropIds: ["soybean"]
    symptoms:
      - "Small round brown spots with narrow purple-brown margins"
      - "Centers turn gray with age"
      - "Lesions on young upper leaves in warm humid weather"
    localNames:
      en: "Frogeye Leaf Spot"
      es: "Mancha ojo de rana"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply a labeled fungicide at R3 (beginning pod) when disease is active on upper canopy; avoid relying on one FRAC group due to resistance."
    preventiveMeasures:
      - "Resistant varieties"
      - "Certified seed"
      - "Rotation"
      - "Rotate fungicide modes of action"
    imageTags: ["frogeye", "cercospora_sojina", "soybean"]
    confidenceThreshold: 0.7
  - id: "brown_spot"
    name: "Septoria Brown Spot"
    scientificName: "Septoria glycines"
    cropIds: ["soybean"]
    symptoms:
      - "Small dark brown angular spots on lower leaves"
      - "Yellow halos; infected leaves drop early"
      - "Starts after canopy closure"
    localNames:
      en: "Brown Spot"
      es: "Mancha café (Septoria)"
    severityLevels: ["low", "medium"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Usually managed culturally; a labeled fungicide at R3 pays when defoliation is progressing in the mid-canopy."
    preventiveMeasures:
      - "Rotate crops"
      - "Incorporate residue"
      - "Improve airflow"
    imageTags: ["brown_spot", "septoria_glycines", "soybean"]
    confidenceThreshold: 0.65
  - id: "fusarium_head_blight"
    name: "Fusarium Head Blight (Scab)"
    scientificName: "Fusarium graminearum"
    cropIds: ["wheat"]
    symptoms:
      - "Bleached spikelets on otherwise green heads"
      - "Orange spore masses at glume bases"
      - "Shriveled, chalk-white grain (tombstones) with mycotoxin risk"
    localNames:
      en: "Head Blight (Scab)"
      es: "Fusariosis de la espiga"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply a labeled DMI (tebuconazole, metconazole, or prosulfuron-based) at flowering (anthesis) when risk models warn; never use strobilurins alone for scab."
    preventiveMeasures:
      - "Avoid maize as previous crop"
      - "Moderately resistant varieties"
      - "Risk-model-based timing"
      - "Harvest clean; manage grain to reduce DON"
    imageTags: ["fusarium_head_blight", "scab", "wheat"]
    confidenceThreshold: 0.75
  - id: "yellow_rust"
    name: "Stripe Rust"
    scientificName: "Puccinia striiformis"
    cropIds: ["wheat"]
    symptoms:
      - "Yellow pustules in stripes along veins"
      - "Yellow spore powder on hands"
      - "Favored by cool, wet springs"
    localNames:
      en: "Stripe Rust"
      es: "Roya amarilla"
    severityLevels: ["medium", "high"]
    treatmentTemplate: "For {disease} in {crop} ({region}): Apply a labeled triazole or strobilurin at first foci; monitor weekly and follow regional rust tracking."
    preventiveMeasures:
      - "Resistant varieties"
      - "Weekly scouting in spring"
      - "Timely fungicide at detection"
    imageTags: ["stripe_rust", "wheat_rust", "wheat"]
    confidenceThreshold: 0.7
weatherSources:
  - id: "open-meteo"
    name: "Open-Meteo"
    type: "open-meteo"
    baseUrl: "https://api.open-meteo.com/v1"
    rateLimit:
      requestsPerMinute: 60
      requestsPerDay: 10000
    parameters:
      models: "best_match"
      timezone: "America/Chicago"
satelliteSources:
  - id: "sentinel-2"
    name: "Sentinel-2"
    type: "sentinel-2"
    baseUrl: "https://services.sentinel-hub.com"
    apiKeyEnvVar: "SENTINEL_HUB_API_KEY"
    bands: ["B02", "B03", "B04", "B08", "B11", "B12"]
    resolution: 10
    revisitDays: 5
    cloudCoverThreshold: 30
providers:
  - id: "gemini-1"
    name: "Google Gemini"
    type: "gemini"
    baseUrl: "https://generativelanguage.googleapis.com"
    apiKeyEnvVar: "GEMINI_API_KEY"
    models:
      gemini-1.5-flash:
        id: "gemini-1.5-flash"
        taskTypes: ["disease-detection", "yield-prediction", "advisory", "chat"]
        maxTokens: 8192
        temperature: 0.4
        costPer1kTokens: 0.0
    rateLimit:
      requestsPerMinute: 60
      requestsPerDay: 1500
      tokensPerMinute: 32000
    regions: ["usa"]
    priority: 100
    enabled: true
  - id: "groq-1"
    name: "Groq"
    type: "groq"
    baseUrl: "https://api.groq.com/openai/v1"
    apiKeyEnvVar: "GROQ_API_KEY"
    models:
      llama-3.1-70b-versatile:
        id: "llama-3.1-70b-versatile"
        taskTypes: ["advisory", "chat", "yield-prediction"]
        maxTokens: 8192
        temperature: 0.3
        costPer1kTokens: 0.0
    rateLimit:
      requestsPerMinute: 30
      requestsPerDay: 6000
      tokensPerMinute: 6000
    regions: ["usa"]
    priority: 90
    enabled: true
promptTemplates:
  - id: "disease-detection-en"
    taskType: "disease-detection"
    language: "en"
    systemPrompt: |
      You are an expert plant pathologist specializing in crop diseases in the United States.
      Analyze the crop image and identify the disease with high accuracy.
      Respond ONLY with valid JSON in this exact format:
      {
        "disease_id": "string (from provided list)",
        "confidence": 0.0-1.0,
        "symptoms": ["symptom1", "symptom2"],
        "reasoning": "brief explanation of visual evidence"
      }
    userPromptTemplate: "Identify the disease in this {crop} image from {region}. Possible diseases: {disease_list}. Consider symptoms like leaf spots, discoloration, wilting, lesions, or pest damage."
    outputFormat: "json"
  - id: "advisory-en"
    taskType: "advisory"
    language: "en"
    systemPrompt: |
      You are a university extension agronomist for U.S. growers.
      Give practical, economical, label-compliant advice (mention IPM first).
      Respond ONLY with valid JSON:
      {
        "treatment": "step-by-step treatment instructions",
        "preventive_measures": ["measure1", "measure2"],
        "follow_up": "when to re-check and next steps",
        "safety_warnings": ["warning1", "warning2"]
      }
    userPromptTemplate: |
      Provide a recommendation for {disease} in {crop} ({region}).
      Severity: {severity}. Language: {language}.
      Symptoms: {symptoms}
      Local names: {local_names}
    outputFormat: "json"
modelConfig:
  edgeModelVersion: "v1.1.0"
  edgeModelUrl: "https://cdn.agrisense.app/models/usa-v1.1.0.tflite"
  edgeModelHash: "sha256:placeholder_hash_replace_with_actual"
  inputSize: 224
  confidenceThreshold: 0.7
  topK: 5
caching:
  diseaseDetectionTtlSeconds: 3600
  yieldPredictionTtlSeconds: 86400
  weatherTtlSeconds: 1800
  satelliteTtlSeconds: 43200
metadata:
  version: "1.0.0"
  lastUpdated: "2026-09-27T00:00:00Z"
  maintainer: "AgriSense Team"
  notes: "United States region configuration: corn, soybean and wheat; English and Spanish support."
